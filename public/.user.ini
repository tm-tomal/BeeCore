; Allows ISP image/video attachments up to 1 GB (config/livewire.php already
; accepts the same size on the Livewire side). If this host uses PHP-FPM,
; ensure nginx/apache client_max_body_size is raised too (e.g. 1024M+).
upload_max_filesize = 1024M
post_max_size = 1080M
max_execution_time = 600
max_input_time = 600
